[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-algebra"
dynamic = ["version"]
description = "Emotion algebra based on Plutchik's Wheel and Cambria's Hourglass of Emotions — signed integer arithmetic over a 4-axis affective space"
license = { text = "Apache-2.0" }
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "deepmoji-onnx>=0.1.0",
]

[project.optional-dependencies]
lexicon = [
    "pandas",
]
fast = [
    "ahocorasick-ner",
]
viz = [
    "matplotlib",
]
all = [
    "emotion-algebra[lexicon,fast,viz]",
]
test = [
    "emotion-algebra[lexicon,fast,viz]",
    "pytest",
    "pytest-cov",
    "hypothesis",
]
# The shared coverage workflow prefers a `dev` extra and falls back to `test`.
dev = [
    "emotion-algebra[test]",
]

[project.scripts]
emotion-algebra = "emotion_algebra.__main__:main"

[project.urls]
Homepage = "https://github.com/TigreGotico/emotion-algebra"

[tool.setuptools.packages.find]
where = ["."]
include = ["emotion_algebra*"]

[tool.setuptools.dynamic]
version = {attr = "emotion_algebra.version.__version__"}

[tool.setuptools.package-data]
emotion_algebra = ["*.csv", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["test"]
