[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-algebra"
version = "1.0.0"
description = "Emotion algebra based on Plutchik's Wheel and Cambria's Hourglass of Emotions — signed integer arithmetic over a 4-axis affective space"
license = { text = "Apache-2.0" }
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "deepmoji-onnx>=0.1.0",
]

[tool.uv.sources]
deepmoji-onnx = { path = "../../Machine Learning Workspace/deepmoji-onnx", editable = true }

[project.optional-dependencies]
lexicon = [
    "pandas",
]
fast = [
    "ahocorasick-ner",
]

[project.scripts]
emotion-algebra = "emotion_algebra.__main__:main"

[project.urls]
Homepage = "https://github.com/JarbasAl/emotion-algebra"

[tool.setuptools.packages.find]
where = ["."]
include = ["emotion_algebra*"]

[tool.setuptools.package-data]
emotion_algebra = ["*.csv"]
