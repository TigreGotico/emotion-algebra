[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "emotion-algebra"
version = "1.0.0"
description = "Emotion algebra based on Plutchik's Wheel and Cambria's Hourglass of Emotions — signed integer arithmetic over a 4-axis affective space"
license = { text = "Apache-2.0" }
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
lexicon = [
    "pandas",
]
deepmoji = [
    "torch",
    "torchvision",
    "torchmoji @ git+https://github.com/huggingface/torchMoji",
]
tagging = [
    "paralleldots",
]
all = [
    "emotion_algebra[lexicon]",
    "emotion_algebra[tagging]",
]

[project.urls]
Homepage = "https://github.com/JarbasAl/emotion-algebra"

[tool.setuptools.packages.find]
where = ["."]
include = ["emotion_algebra*"]

[tool.setuptools.package-data]
emotion_algebra = ["*.csv"]
